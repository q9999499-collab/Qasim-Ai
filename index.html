<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d12">
<title>Qasim AI — Intelligent Assistant</title>
<style>
:root{--bg:#0b0d12;--panel:#11151d;--panel2:#171c25;--line:#252c38;--text:#f5f7fb;--muted:#8e98a8;--accent:#7c5cff;--user:#202735;--assistant:#141922}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#1b2140 0,#0b0d12 42%);color:var(--text);font:15px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100vh}main{height:100vh;display:flex;flex-direction:column;max-width:1120px;margin:auto;border-left:1px solid var(--line);border-right:1px solid var(--line);background:rgba(11,13,18,.86);backdrop-filter:blur(14px)}header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line);background:rgba(11,13,18,.88);z-index:2}.brand{font-weight:800;font-size:18px}.brand small{font-size:10px;color:#62d7a5;margin-left:8px;letter-spacing:.12em}.new{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:8px 12px;cursor:pointer}.chat{flex:1;overflow:auto;padding:28px 18px 150px}.welcome{text-align:center;max-width:680px;margin:15vh auto 0}.welcome h1{font-size:34px;margin:0 0 10px}.welcome p{color:var(--muted);margin:0}.m{display:flex;margin:22px auto;max-width:850px}.m.user{justify-content:flex-end}.bubble{max-width:82%;padding:13px 16px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:var(--user);border-bottom-right-radius:6px}.assistant .bubble{background:var(--assistant);border:1px solid #1e2530;border-bottom-left-radius:6px}.meta{font-size:11px;color:var(--muted);margin:0 0 5px 4px}.composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(1080px,100%);padding:12px 16px 18px;background:linear-gradient(transparent,var(--bg) 28%);z-index:3}.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.3);overflow:hidden}.preview{display:none;padding:10px 12px;border-bottom:1px solid var(--line)}.preview img{max-height:100px;max-width:160px;border-radius:10px}.row{display:flex;align-items:flex-end;gap:8px;padding:9px}.textarea{flex:1;min-height:46px;max-height:180px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:10px;font:inherit}.btn{height:42px;border:0;border-radius:12px;padding:0 14px;color:white;background:var(--accent);font-weight:700;cursor:pointer}.btn.secondary{background:var(--panel2);border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}.tools{display:flex;gap:8px;padding:0 10px 9px}.status{text-align:center;color:var(--muted);font-size:12px;margin-top:7px}.image{max-width:min(760px,100%);border-radius:14px;display:block;margin-top:10px;border:1px solid var(--line)}
@media(max-width:700px){.welcome h1{font-size:28px}.bubble{max-width:92%}.chat{padding-left:10px;padding-right:10px}.composer{padding-left:8px;padding-right:8px}}
</style>
</head>
<body>
<main>
<header><div class="brand">Qasim AI <small>REAL AI</small></div><button class="new" id="clear">New chat</button></header>
<div class="chat" id="msgs"><div class="welcome" id="welcome"><h1>What can I help with?</h1><p>Ask in English, Urdu or Roman Urdu. Generate images or upload an image to transform it.</p></div></div>
<div class="composer"><div class="box"><div class="preview" id="preview"><img id="previewImg"><button class="new" id="removeImage">Remove</button></div><div class="row"><textarea class="textarea" id="input" placeholder="Message Qasim AI…"></textarea><button class="btn" id="send">➤</button></div><div class="tools"><button class="btn secondary" id="imageMode">🖼️ Create image</button><label class="btn secondary" for="file">📎 Add image</label><input id="file" type="file" accept="image/*" hidden></div></div><div class="status" id="status">Ready</div></div>
</main>
<script>
const API="https://qasim-ai-api.q9999499.workers.dev/v1/chat/completions";
const IMG="https://qasim-ai-api.q9999499.workers.dev/v1/images/generations";
const MODEL="@cf/zai-org/glm-4.7-flash";
const msgs=document.getElementById('msgs'),input=document.getElementById('input'),send=document.getElementById('send'),status=document.getElementById('status'),file=document.getElementById('file'),preview=document.getElementById('preview'),previewImg=document.getElementById('previewImg'),welcome=document.getElementById('welcome'),imageButton=document.getElementById('imageMode');
let history=JSON.parse(localStorage.getItem('qasim_history')||'[]');
let imageMode=false,busy=false,inputImage=null;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setStatus(t){status.textContent=t}
function add(role,text,img){welcome?.remove();const el=document.createElement('div');el.className='m '+role;const bubble=document.createElement('div');bubble.className='bubble';bubble.innerHTML='<div class="meta">'+(role==='user'?'You':'Qasim')+'</div>'+esc(text)+(img?'<img class="image" src="data:image/jpeg;base64,'+img+'">':'');el.appendChild(bubble);msgs.appendChild(el);msgs.scrollTop=msgs.scrollHeight}
function save(){localStorage.setItem('qasim_history',JSON.stringify(history.slice(-16)))}
function clear(){history=[];localStorage.removeItem('qasim_history');msgs.innerHTML='<div class="welcome" id="welcome"><h1>What can I help with?</h1><p>Ask in English, Urdu or Roman Urdu. Generate images or upload an image to transform it.</p></div>';setStatus('Ready')}
async function ask(text){if(!text||busy)return;busy=true;send.disabled=true;add('user',text);history.push({role:'user',content:text});save();setStatus('Qasim is thinking…');try{const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:MODEL,messages:history.slice(-16)})});const data=await res.json().catch(()=>null);if(!res.ok)throw Error(data?.error?.message||`Backend error (${res.status})`);const answer=data?.choices?.[0]?.message?.content||data?.response||data?.text;if(!answer)throw Error('The AI backend returned an empty response.');history.push({role:'assistant',content:answer});save();add('assistant',answer);setStatus('Ready')}catch(e){add('assistant','Error: '+(e.message||'Unable to connect to Qasim AI.'));setStatus('Error')}finally{busy=false;send.disabled=false}}
async function generate(prompt){if(!prompt||busy)return;busy=true;send.disabled=true;add('user',prompt);setStatus(inputImage?'Editing image…':'Generating image…');try{const payload={prompt};if(inputImage)payload.input_image=inputImage;const res=await fetch(IMG,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await res.json().catch(()=>null);if(!res.ok)throw Error(data?.error?.message||`Image backend error (${res.status})`);const b=data?.data?.[0]?.b64_json;if(!b)throw Error('Image backend returned no image.');add('assistant',inputImage?'Done — image transformed.':'Done — image generated.',b);setStatus('Ready')}catch(e){add('assistant','Image error: '+e.message);setStatus('Error')}finally{busy=false;send.disabled=false}}
function resizeImage(f){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=1024,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.88))};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(f)})}
file.onchange=async()=>{const f=file.files?.[0];if(!f)return;try{inputImage=await resizeImage(f);previewImg.src=inputImage;preview.style.display='block';imageMode=true;imageButton.textContent='✏️ Edit image';input.placeholder='Describe how you want to change this image…';setStatus('Reference image attached — describe your changes')}catch{setStatus('Could not read image')}};
document.getElementById('removeImage').onclick=()=>{inputImage=null;file.value='';preview.style.display='none';imageMode=false;imageButton.textContent='🖼️ Create image';input.placeholder='Message Qasim AI…';setStatus('Ready')};
imageButton.onclick=()=>{imageMode=!imageMode;imageButton.textContent=inputImage?'✏️ Edit image':(imageMode?'🖼️ Image mode ON':'🖼️ Create image');input.placeholder=imageMode?(inputImage?'Describe how you want to change this image…':'Describe the image you want…'):'Message Qasim AI…'};
document.getElementById('clear').onclick=clear;
send.onclick=()=>{const t=input.value.trim();if(!t)return;input.value='';if(imageMode||inputImage){imageMode=false;imageButton.textContent=inputImage?'✏️ Edit image':'🖼️ Create image';generate(t)}else ask(t)};
input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send.click()}};
if(history.length){welcome.remove();for(const m of history){add(m.role,m.content)}}
</script>
</body>
</html>
