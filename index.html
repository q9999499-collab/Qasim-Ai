<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090d"><title>Qasim AI</title><style>body{margin:0;background:#08090d;color:#f5f7fb;font:16px system-ui;height:100vh}main{max-width:900px;margin:auto;height:100vh;display:flex;flex-direction:column}header{padding:18px;border-bottom:1px solid #252a35;font-weight:800}#msgs{flex:1;overflow:auto;padding:24px}.m{margin:18px 0;white-space:pre-wrap;line-height:1.65}.u{text-align:right}.b{display:inline-block;max-width:85%;padding:12px 16px;border-radius:16px;background:#171c27}.u .b{background:#1b2130}form{display:flex;gap:8px;padding:16px;border-top:1px solid #252a35}textarea{flex:1;resize:none;background:#0f121a;color:#fff;border:1px solid #303746;border-radius:14px;padding:12px;min-height:44px}button{background:#7c5cff;color:white;border:0;border-radius:12px;padding:0 18px;font-weight:700}button:disabled{opacity:.5}.tools{display:flex;gap:8px;padding:0 16px 10px}.tools button{padding:8px 12px}.status{color:#9aa4b2;font-size:12px;padding:0 16px 12px}</style></head><body><main><header>Qasim AI <span style="float:right;font-size:12px;color:#35a7ff">REAL AI</span></header><div id="msgs"></div><div class="status" id="status">Ready</div><div class="tools"><button type="button" id="img">🖼️ Image</button><button type="button" id="clear">Clear</button></div><form id="form"><textarea id="input" placeholder="Message Qasim AI…"></textarea><button id="send">➤</button></form></main><script>
const API="https://qasim-ai-api.q9999499.workers.dev/v1/chat/completions",IMG="https://qasim-ai-api.q9999499.workers.dev/v1/images/generations",MODEL="@cf/zai-org/glm-4.7-flash";const msgs=document.getElementById('msgs'),input=document.getElementById('input'),send=document.getElementById('send'),status=document.getElementById('status');let history=[],imageMode=false,busy=false;function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function add(role,text){msgs.insertAdjacentHTML('beforeend',`<div class="m ${role==='user'?'u':''}"><span class="b">${esc(text)}</span></div>`);msgs.scrollTop=msgs.scrollHeight}function setStatus(t){status.textContent=t}function keepRecentContext(){if(history.length>12)history=history.slice(-12)}async function ask(text){if(!text||busy)return;busy=true;send.disabled=true;add('user',text);history.push({role:'user',content:text});keepRecentContext();setStatus('Qasim is thinking…');try{const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:MODEL,messages:history})});const data=await res.json().catch(()=>null);if(!res.ok)throw Error(data?.error?.message||`Backend error (${res.status})`);const answer=data?.choices?.[0]?.message?.content||data?.response||data?.text;if(!answer)throw Error('The AI backend returned an empty response.');history.push({role:'assistant',content:answer});keepRecentContext();add('assistant',answer);setStatus('Ready')}catch(e){add('assistant','Error: '+(e.message||'Unable to connect to Qasim AI.'));setStatus('Error')}finally{busy=false;send.disabled=false}}async function image(prompt){if(busy)return;busy=true;send.disabled=true;setStatus('Generating image…');try{const res=await fetch(IMG,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,steps:4})});const data=await res.json().catch(()=>null);if(!res.ok)throw Error(data?.error?.message||`Image backend error (${res.status})`);const b=data?.data?.[0]?.b64_json;if(!b)throw Error('Image backend returned no image.');msgs.insertAdjacentHTML('beforeend',`<div class="m"><span class="b">${esc(prompt)}<br><img style="max-width:100%;margin-top:10px;border-radius:12px" src="data:image/jpeg;base64,${b}"></span></div>`);msgs.scrollTop=msgs.scrollHeight;setStatus('Ready')}catch(e){add('assistant','Image error: '+e.message);setStatus('Error')}finally{busy=false;send.disabled=false}}form.onsubmit=e=>{e.preventDefault();const t=input.value.trim();input.value='';if(imageMode){imageMode=false;document.getElementById('img').textContent='🖼️ Image';image(t)}else ask(t)};document.getElementById('img').onclick=()=>{imageMode=!imageMode;document.getElementById('img').textContent=imageMode?'🖼️ Image ON':'🖼️ Image'};document.getElementById('clear').onclick=()=>{history=[];msgs.innerHTML='';setStatus('Ready')};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}};</script></body></html>
