<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090d"><title>Qasim Mind</title><style>:root{--bg:#08090d;--p:#11151d;--p2:#171c26;--line:#292f3d;--txt:#f8fafc;--muted:#9aa4b2;--a:#7c5cff;--b:#45d7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#252b61,#08090d 48%);color:var(--txt);font:15px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}button,textarea,input{font:inherit}button{cursor:pointer}.app{height:100dvh;display:flex}.side{width:270px;border-right:1px solid var(--line);background:#0d0f15ee;padding:14px;display:flex;flex-direction:column}.logo{font-weight:900;font-size:20px;margin:4px 4px 14px}.new,.tool{border:1px solid var(--line);background:var(--p2);color:var(--txt);border-radius:11px;padding:9px 11px}.new{width:100%;font-weight:800}.history{overflow:auto;margin-top:12px}.history button{display:block;width:100%;text-align:left;background:transparent;color:var(--muted);border:1px solid transparent;border-radius:10px;padding:9px;margin:4px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.history button.active,.history button:hover{background:var(--p2);border-color:var(--line);color:var(--txt)}.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#090a0fdc;backdrop-filter:blur(18px)}.chat{flex:1;overflow:auto;padding:25px 14px 180px}.welcome{max-width:760px;text-align:center;margin:12vh auto}.orb{width:66px;height:66px;border-radius:21px;margin:auto auto 16px;display:grid;place-items:center;font-size:30px;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 0 55px #6d5cff55}.welcome h1{font-size:38px;line-height:1.1;margin:0 0 10px}.welcome p{color:var(--muted)}.m{max-width:900px;margin:20px auto;display:flex}.m.user{justify-content:flex-end}.bubble{max-width:84%;padding:13px 16px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--p);border:1px solid #202530}.user .bubble{background:#202632;border:0;border-bottom-right-radius:6px}.assistant .bubble{border-bottom-left-radius:6px}.meta{font-size:11px;color:var(--muted);margin-bottom:5px}.img{display:block;max-width:100%;max-height:65vh;border-radius:14px;margin-top:10px;border:1px solid var(--line)}.actions{display:flex;gap:7px;margin-top:8px}.mini{font-size:12px;padding:6px 9px}.editbox{width:100%;min-height:120px;resize:vertical;background:#0b0e14;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;outline:none}.composer{position:fixed;bottom:0;left:calc(50% + 135px);transform:translateX(-50%);width:min(900px,calc(100% - 300px));padding:12px 16px 18px;background:linear-gradient(transparent,var(--bg) 28%);z-index:5}.box{background:#11131af7;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 18px 55px #0007}.preview{display:none;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--line)}.preview img{width:90px;height:70px;object-fit:cover;border-radius:10px}.preview span{flex:1;color:var(--muted);font-size:12px}.row{display:flex;gap:8px;padding:9px}.input{flex:1;min-height:48px;max-height:180px;resize:none;background:transparent;color:var(--txt);border:0;outline:0;padding:10px}.send{width:48px;height:44px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--a),#5c7cff);color:white;font-weight:900;font-size:19px}.send:disabled{opacity:.4}.tools{display:flex;gap:7px;flex-wrap:wrap;padding:0 10px 10px}.tool.active{background:#302567;border-color:#6f5cf5}.status{text-align:center;color:var(--muted);font-size:12px;min-height:22px}.progress{height:2px;overflow:hidden;background:#181c26}.progress:after{content:"";display:block;width:35%;height:100%;background:linear-gradient(90deg,var(--a),var(--b));animation:slide 1.2s infinite}@keyframes slide{from{transform:translateX(-120%)}to{transform:translateX(360%)}}.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#aaa;margin:0 2px;animation:d 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes d{50%{transform:translateY(-4px);opacity:.4}}@media(max-width:800px){.side{display:none}.composer{left:50%;width:100%}.welcome h1{font-size:30px}.bubble{max-width:94%}}</style></head><body><div class="app"><aside class="side"><div class="logo">Qasim Mind</div><button class="new" id="new">＋ New chat</button><div class="history" id="history"></div></aside><main class="main"><header class="top"><strong>Qasim Mind</strong><span class="status">Gemini · FLUX · Web · Files</span><button class="tool" id="clear">Clear</button></header><div class="chat" id="chat"></div><div class="composer"><div class="box"><div class="preview" id="preview"><img id="ref"><span id="refText">Reference image</span><button class="tool" id="remove">Remove</button></div><div class="row"><textarea id="input" class="input" placeholder="Message Qasim Mind…"></textarea><button id="send" class="send">➤</button></div><div class="tools"><button class="tool" id="imgMode">🖼️ Create image</button><label class="tool" for="file">📎 Add image</label><input id="file" type="file" accept="image/*" hidden><button class="tool active" id="web">🔎 Web search: Auto</button><button class="tool" id="export">💾 Export chats</button></div></div><div class="status" id="status">Ready</div><div class="progress" id="progress" hidden></div></div></main></div><script>const API='https://qasim-ai-api.q9999499.workers.dev',CHAT=API+'/v1/chat/completions',IMG=API+'/v1/images/generations',HIST=API+'/v1/history',STORE='qasim_chats_v8';const $=id=>document.getElementById(id);let chats=[],current=null,busy=false,imgMode=false,webAuto=true,ref=null,clientId=localStorage.getItem('qasim_client')||crypto.randomUUID();localStorage.setItem('qasim_client',clientId);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function stat(s,load=false){$('status').innerHTML=load?esc(s)+' <span class="dots"><i></i><i></i><i></i></span>':esc(s);$('progress').hidden=!load}function save(){localStorage.setItem(STORE,JSON.stringify(chats));historyUI()}function newChat(){current={id:crypto.randomUUID(),title:'New conversation',messages:[],updated:Date.now()};chats.unshift(current);save();render();stat('Ready')}function historyUI(){let h=$('history');h.innerHTML='';chats.forEach(c=>{let b=document.createElement('button');b.textContent=c.title;b.className=c.id===current?.id?'active':'';b.onclick=()=>{current=c;render()};h.appendChild(b)})}function copyText(text){if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text);else{let t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}stat('Text copied')}function editText(i){let m=current.messages[i];let bubble=document.querySelector('[data-msg="'+i+'"]');if(!bubble)return;let old=esc(m.content);bubble.innerHTML='<div class="meta">Qasim Mind</div><textarea class="editbox" id="edit-'+i+'">'+old+'</textarea><div class="actions"><button class="tool mini" onclick="saveEdit('+i+')">💾 Save</button><button class="tool mini" onclick="render()">Cancel</button></div>'}function saveEdit(i){let e=document.getElementById('edit-'+i);if(!e)return;current.messages[i].content=e.value;current.updated=Date.now();save();render();stat('Text updated')}function render(){historyUI();let box=$('chat');box.innerHTML='';if(!current||!current.messages.length){box.innerHTML='<div class="welcome"><div class="orb">✦</div><h1>What can I help with?</h1><p>Chat, generate images, edit uploaded images, search the web and keep your conversations.</p></div>';return}current.messages.forEach((m,i)=>{let x=document.createElement('div');x.className='m '+m.role;let b=document.createElement('div');b.className='bubble';b.setAttribute('data-msg',i);b.innerHTML='<div class="meta">'+(m.role==='user'?'You':'Qasim Mind')+'</div>'+esc(m.content);if(m.role==='assistant'){let a=document.createElement('div');a.className='actions';let c=document.createElement('button');c.className='tool mini';c.textContent='📋 Copy text';c.onclick=()=>copyText(m.content);let e=document.createElement('button');e.className='tool mini';e.textContent='✏️ Edit text';e.onclick=()=>editText(i);a.append(c,e);b.appendChild(a)}if(m.image){let im=document.createElement('img');im.className='img';im.src='data:image/jpeg;base64,'+m.image;b.appendChild(im);let a=document.createElement('div');a.className='actions';let d=document.createElement('button');d.className='tool mini';d.textContent='⬇ Download';d.onclick=()=>download(m.image);a.appendChild(d);b.appendChild(a)}x.appendChild(b);box.appendChild(x)});box.scrollTop=box.scrollHeight}function add(role,content,image=null){if(!current)newChat();current.messages.push({role,content,image});current.updated=Date.now();if(role==='user'&&current.title==='New conversation')current.title=content.slice(0,55)+(content.length>55?'…':'');save();render()}function download(b){let a=document.createElement('a');a.href='data:image/jpeg;base64,'+b;a.download='qasim-mind-image.jpg';a.click()}function imageRequest(t){return /\b(generate|create|make|draw|render|design|photo|image|picture|pic|tasveer|banao|bana do)\b/i.test(t)&&/\b(image|photo|picture|pic|tasveer|banao|bana|generate|create|draw|render)\b/i.test(t)}function size(t){if(/4\s*[:x]\s*5/i.test(t))return[1024,1280];if(/9\s*[:x]\s*16/i.test(t))return[1024,1792];if(/16\s*[:x]\s*9/i.test(t))return[1536,864];return[1024,1024]}async function call(url,opt,label){let c=new AbortController(),timer=setTimeout(()=>c.abort(),65000);try{stat(label,true);let r=await fetch(url,{...opt,signal:c.signal});let d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.error?.message||d?.error?.code||'Backend error');return d}finally{clearTimeout(timer)}}function resize(f){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>{let i=new Image();i.onload=()=>{let s=Math.min(1,1024/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.88))};i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(f)})}async function send(){let t=$('input').value.trim();if(!t||busy)return;if(!current)newChat();busy=true;$('send').disabled=true;add('user',t);$('input').value='';try{if(imgMode||ref||imageRequest(t)){let [w,h]=size(t);let d=await call(IMG,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:t,width:w,height:h,input_image:ref||undefined})},ref?'Editing image':'Generating image');let b=d?.data?.[0]?.b64_json;if(!b)throw Error('Image backend returned no image');add('assistant',ref?'Image edited successfully.':'Image generated successfully.',b);stat('Ready')}else{let msgs=current.messages.slice(-16).map(m=>({role:m.role,content:m.content}));let d=await call(CHAT,{method:'POST',headers:{'Content-Type':'application/json','X-Qasim-Client':clientId},body:JSON.stringify({messages:msgs,client_id:clientId,conversation_id:current.id,web_search:webAuto})},'Qasim Mind is thinking');let a=d?.choices?.[0]?.message?.content;if(!a)throw Error('AI returned an empty response');add('assistant',a);stat(d.web_search?'Answered with web context':'Ready')}}catch(e){add('assistant','Error: '+(e.name==='AbortError'?'Request timed out. Please try again.':e.message));stat('Request failed')}finally{busy=false;$('send').disabled=false}}$('send').onclick=send;$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('new').onclick=newChat;$('clear').onclick=()=>{if(current){current.messages=[];current.title='New conversation';save();render();stat('Chat cleared')}};$('imgMode').onclick=()=>{imgMode=!imgMode;$('imgMode').classList.toggle('active',imgMode);$('imgMode').textContent=ref?'✏️ Edit image':imgMode?'🖼️ Image mode ON':'🖼️ Create image';$('input').placeholder=imgMode?(ref?'Describe how to edit this image…':'Describe the image you want…'):'Message Qasim Mind…'};$('web').onclick=()=>{webAuto=!webAuto;$('web').textContent='🔎 Web search: '+(webAuto?'Auto':'Off');$('web').classList.toggle('active',webAuto)};$('file').onchange=async()=>{let f=$('file').files?.[0];if(!f)return;if(f.type.startsWith('image/')){ref=await resize(f);$('ref').src=ref;$('preview').style.display='flex';$('refText').textContent='Reference image ready';imgMode=true;$('imgMode').classList.add('active');$('imgMode').textContent='✏️ Edit image';stat('Reference image ready')}else stat('Only image upload is enabled in this browser UI; PDF/text can be wired through Supabase storage next.')};$('remove').onclick=()=>{ref=null;$('file').value='';$('preview').style.display='none';imgMode=false;$('imgMode').classList.remove('active');$('imgMode').textContent='🖼️ Create image'};$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(chats,null,2)],{type:'application/json'}));a.download='qasim-mind-chats.json';a.click()};async function load(){try{chats=JSON.parse(localStorage.getItem(STORE)||'[]');if(!Array.isArray(chats))chats=[]}catch{chats=[]}if(!chats.length)newChat();else{current=chats[0];render()}try{let d=await fetch(HIST,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({client_id:clientId})}).then(r=>r.json());if(d.configured&&Array.isArray(d.conversations)){for(const x of d.conversations)if(!chats.some(c=>c.id===x.id))chats.push({id:x.id,title:x.title,messages:[],updated:Date.parse(x.updated_at)});save();render()}}catch{}}load();</script></body></html>
