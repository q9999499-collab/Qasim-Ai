<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0f"><title>Qasim AI — Intelligent Assistant</title>
<style>
:root{--bg:#090a0f;--panel:#11131a;--panel2:#181b24;--line:#292d38;--text:#f7f8fb;--muted:#949bac;--accent:#7c5cff;--user:#202532;--assistant:#12151c}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}button,textarea{font:inherit}button{cursor:pointer}.app{height:100dvh;display:flex;background:radial-gradient(circle at 50% -15%,#252b61 0,#090a0f 43%)}.sidebar{width:270px;background:#0d0f15e8;border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column}.logo{font-weight:850;font-size:19px;margin:4px 0 14px}.logo small{font-size:9px;color:#6ee7b7;letter-spacing:.12em;margin-left:7px}.new,.tool,.mini{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:11px;padding:8px 11px}.new{width:100%;font-weight:700}.history{margin-top:12px;overflow:auto}.history button{width:100%;display:block;text-align:left;background:transparent;color:var(--muted);border:1px solid transparent;border-radius:10px;padding:9px;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history button:hover,.history button.active{background:var(--panel2);border-color:var(--line);color:var(--text)}.main{min-width:0;flex:1;display:flex;flex-direction:column}.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#090a0fd9;backdrop-filter:blur(18px)}.model{font-size:12px;color:var(--muted)}.mobile{display:none}.chat{flex:1;overflow:auto;padding:28px 18px 175px}.welcome{max-width:760px;margin:13vh auto 0;text-align:center}.orb{width:66px;height:66px;border-radius:21px;margin:auto auto 18px;display:grid;place-items:center;font-size:29px;background:linear-gradient(135deg,#7c5cff,#45d7ff);box-shadow:0 0 55px #6d5cff55}.welcome h1{font-size:38px;line-height:1.15;margin:0 0 10px}.welcome p{color:var(--muted)}.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:20px}.chip{border:1px solid var(--line);padding:7px 10px;border-radius:999px;color:var(--muted)}.m{display:flex;max-width:900px;margin:24px auto}.user{justify-content:flex-end}.bubble{max-width:82%;padding:13px 16px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:var(--user);border-bottom-right-radius:6px}.assistant .bubble{background:var(--assistant);border:1px solid #202530;border-bottom-left-radius:6px}.meta{font-size:11px;color:var(--muted);margin-bottom:5px}.image{display:block;max-width:min(760px,100%);max-height:70vh;border-radius:14px;margin-top:10px;border:1px solid var(--line)}.imageActions{display:flex;gap:7px;margin-top:9px}.mini{font-size:12px;padding:6px 9px}.composer{position:fixed;bottom:0;left:calc(50% + 135px);transform:translateX(-50%);width:min(900px,calc(100% - 300px));padding:12px 16px 18px;background:linear-gradient(transparent,var(--bg) 27%);z-index:5}.box{background:#11131af5;border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 55px #0006;overflow:hidden;backdrop-filter:blur(16px)}.preview{display:none;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}.preview img{width:100px;height:80px;object-fit:cover;border-radius:10px}.previewInfo{flex:1;color:var(--muted);font-size:12px}.row{display:flex;gap:8px;align-items:flex-end;padding:9px}.input{flex:1;min-height:48px;max-height:190px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:10px}.send{height:44px;width:48px;border:0;border-radius:13px;background:linear-gradient(135deg,#7c5cff,#5c7cff);color:white;font-size:19px;font-weight:800}.send:disabled{opacity:.45}.tools{display:flex;gap:7px;flex-wrap:wrap;padding:0 10px 10px}.tool.active{background:#302567;border-color:#6f5cf5}.status{text-align:center;color:var(--muted);font-size:12px;margin-top:6px}@media(max-width:800px){.sidebar{display:none}.mobile{display:block}.composer{left:50%;width:100%}.welcome h1{font-size:30px}.chat{padding-left:10px;padding-right:10px}.bubble{max-width:92%}}
</style></head>
<body><div class="app">
<aside class="sidebar"><div class="logo">Qasim AI <small>REAL AI</small></div><button class="new" id="new">＋ New chat</button><div class="history" id="history"></div></aside>
<section class="main"><header class="top"><button class="mobile tool" id="mobileNew">＋</button><div class="model">Qasim AI · Chat · Image generation · Image editing</div><button class="tool" id="clear">Clear</button></header>
<div class="chat" id="msgs"></div>
<div class="composer"><div class="box"><div class="preview" id="preview"><img id="previewImg"><div class="previewInfo" id="previewInfo">Reference image attached</div><button class="tool" id="remove">Remove</button></div><div class="row"><textarea class="input" id="input" placeholder="Message Qasim AI…"></textarea><button class="send" id="send">➤</button></div><div class="tools"><button class="tool" id="imageMode">🖼️ Create image</button><label class="tool" for="file">📎 Add image</label><input id="file" type="file" accept="image/*" hidden><button class="tool" id="export">💾 Save chats</button></div></div><div class="status" id="status">Ready</div></div>
</section></div>
<script>
const API="https://qasim-ai-api.q9999499.workers.dev/v1/chat/completions",IMG="https://qasim-ai-api.q9999499.workers.dev/v1/images/generations",MODEL="@cf/zai-org/glm-4.7-flash",STORE="qasim_chats_v6";
const $=x=>document.getElementById(x);let chats=[],currentId=null,imageMode=false,inputImage=null,busy=false;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function status(x){$("status").textContent=x}function current(){return chats.find(x=>x.id===currentId)}function save(){localStorage.setItem(STORE,JSON.stringify(chats));renderHistory()}
function newChat(){const c={id:crypto.randomUUID(),title:"New conversation",messages:[],updated:Date.now()};chats.unshift(c);currentId=c.id;save();render();status("Ready")}function renderHistory(){const h=$("history");h.innerHTML="";for(const c of chats.slice(0,50)){const b=document.createElement("button");b.textContent=c.title;b.className=c.id===currentId?"active":"";b.onclick=()=>{currentId=c.id;render()};h.appendChild(b)}}
function welcome(){return '<div class="welcome"><div class="orb">✦</div><h1>What can I help with?</h1><p>Ask in English, Urdu or Roman Urdu. Qasim can chat, generate images, edit photos, and save your conversations.</p><div class="chips"><span class="chip">🧠 Ask anything</span><span class="chip">🖼️ Generate image</span><span class="chip">📎 Edit photo</span></div></div>'}
function bubble(m){const el=document.createElement("div");el.className="m "+m.role;const b=document.createElement("div");b.className="bubble";b.innerHTML='<div class="meta">'+(m.role==='user'?"You":"Qasim")+'</div>'+esc(m.content);if(m.image){const im=document.createElement("img");im.className="image";im.src="data:image/jpeg;base64,"+m.image;b.appendChild(im);const a=document.createElement("div");a.className="imageActions";const d=document.createElement("button");d.className="mini";d.textContent="⬇ Download image";d.onclick=()=>download(m.image);a.appendChild(d);b.appendChild(a)}el.appendChild(b);return el}
function render(){renderHistory();const box=$("msgs");box.innerHTML="";const c=current();if(!c||!c.messages.length){box.innerHTML=welcome();return}c.messages.forEach(m=>box.appendChild(bubble(m)));box.scrollTop=box.scrollHeight}
function add(role,content,image=null){const c=current();c.messages.push({role,content,image});c.updated=Date.now();if(role==='user'&&c.title==='New conversation')c.title=content.slice(0,45)+(content.length>45?'…':'');save();render()}
function download(b64){const a=document.createElement("a");a.href="data:image/jpeg;base64,"+b64;a.download="qasim-ai-image.jpg";document.body.appendChild(a);a.click();a.remove()}
function looksLikeImageRequest(text){const t=text.toLowerCase();return /\b(generate|create|make|draw|render|design|show me|produce|generate me|create me|banao|bana do|tasveer|tasveer banao|photo|image|picture|pic)\b/.test(t)&&/\b(image|photo|picture|pic|tasveer|banao|bana|generate|create|draw|render)\b/.test(t)}
function getSize(text){const t=text.toLowerCase();if(/4\s*[:x]\s*5/.test(t))return{width:1024,height:1280};if(/9\s*[:x]\s*16/.test(t))return{width:1024,height:1792};if(/16\s*[:x]\s*9/.test(t))return{width:1536,height:864};if(/1\s*[:x]\s*1/.test(t))return{width:1024,height:1024};return{width:1024,height:1024}}
async function ask(text){if(!text||busy)return;busy=true;$("send").disabled=true;add('user',text);status('Qasim is thinking…');try{const messages=current().messages.filter(m=>!m.image).slice(-16).map(m=>({role:m.role,content:m.content}));const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:MODEL,messages})});const d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.error?.message||`Backend error (${r.status})`);const answer=d?.choices?.[0]?.message?.content||d?.response||d?.text;if(!answer)throw Error('The AI backend returned an empty response.');add('assistant',answer);status('Ready')}catch(e){add('assistant','Error: '+e.message);status('Error')}finally{busy=false;$("send").disabled=false}}
async function generate(prompt){if(!prompt||busy)return;busy=true;$("send").disabled=true;add('user',prompt);status(inputImage?'Editing image…':'Generating image…');try{const size=getSize(prompt);const p={prompt,width:size.width,height:size.height,guidance:3.5};if(inputImage)p.input_image=inputImage;const r=await fetch(IMG,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});const d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.error?.message||`Image backend error (${r.status})`);const b=d?.data?.[0]?.b64_json;if(!b)throw Error('Image backend returned no image.');add('assistant',inputImage?'Done — image transformed.':'Done — image generated.',b);status('Ready')}catch(e){add('assistant','Image error: '+e.message);status('Error')}finally{busy=false;$("send").disabled=false}}
function resize(f){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=512,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.86))};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(f)})}
$("file").onchange=async()=>{const f=$("file").files?.[0];if(!f)return;try{inputImage=await resize(f);$("previewImg").src=inputImage;$("preview").style.display='flex';$("previewInfo").textContent='Reference image ready — describe your changes';imageMode=true;$("imageMode").classList.add('active');$("imageMode").textContent='✏️ Edit image';$("input").placeholder='Describe how you want to change this image…';status('Reference image ready')}catch{status('Could not read image')}};
$("remove").onclick=()=>{inputImage=null;$("file").value='';$("preview").style.display='none';imageMode=false;$("imageMode").classList.remove('active');$("imageMode").textContent='🖼️ Create image';$("input").placeholder='Message Qasim AI…'};
$("imageMode").onclick=()=>{imageMode=!imageMode;$("imageMode").classList.toggle('active',imageMode);$("imageMode").textContent=inputImage?'✏️ Edit image':(imageMode?'🖼️ Image mode ON':'🖼️ Create image');$("input").placeholder=imageMode?(inputImage?'Describe how you want to change this image…':'Describe the image you want…'):'Message Qasim AI…'};
function clearCurrent(){const c=current();if(!c)return;c.messages=[];c.title='New conversation';save();render();status('Chat cleared')}
$("new").onclick=newChat;$("mobileNew").onclick=newChat;$("clear").onclick=clearCurrent;$("export").onclick=()=>{const blob=new Blob([JSON.stringify(chats,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='qasim-ai-chats.json';a.click();URL.revokeObjectURL(a.href)};
$("send").onclick=()=>{const t=$("input").value.trim();if(!t)return;$("input").value='';if(imageMode||inputImage||looksLikeImageRequest(t)){imageMode=false;$("imageMode").classList.remove('active');$("imageMode").textContent=inputImage?'✏️ Edit image':'🖼️ Create image';generate(t)}else ask(t)};$("input").onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$("send").click()}};
try{chats=JSON.parse(localStorage.getItem(STORE)||'[]')}catch{chats=[]}if(!Array.isArray(chats))chats=[];if(!chats.length)newChat();else{currentId=chats[0].id;render()}
</script></body></html>
