<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090d">
<meta name="description" content="Qasim AI — a modern AI assistant interface.">
<title>Qasim AI</title>
<style>
:root{--bg:#08090d;--panel:#0d1017;--panel2:#111521;--text:#f4f7fb;--muted:#98a2b3;--border:rgba(255,255,255,.09);--accent:#7c5cff;--accent2:#35a7ff;--danger:#ff5d73;--user:#171b28;--shadow:0 20px 60px rgba(0,0,0,.35);--font:15px}
body.light{--bg:#f5f7fb;--panel:#fff;--panel2:#eef1f7;--text:#111827;--muted:#667085;--border:rgba(17,24,39,.1);--user:#edf0f7;--shadow:0 20px 60px rgba(30,41,59,.12)}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 20% 0%,rgba(124,92,255,.12),transparent 32%),radial-gradient(circle at 90% 20%,rgba(53,167,255,.09),transparent 28%),var(--bg);color:var(--text);font-size:var(--font);overflow:hidden}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}.app{display:flex;height:100vh}.sidebar{width:280px;background:rgba(10,12,18,.92);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px;z-index:20;backdrop-filter:blur(18px)}.light .sidebar{background:rgba(255,255,255,.94)}.brand{display:flex;align-items:center;gap:11px;padding:4px 6px 18px;font-weight:800;font-size:20px}.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 28px rgba(124,92,255,.3);font-weight:900}.new-chat{width:100%;border:1px solid var(--border);background:linear-gradient(135deg,rgba(124,92,255,.18),rgba(53,167,255,.1));padding:12px;border-radius:12px;font-weight:700;text-align:left}.search{margin:12px 0}.search input{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:10px;outline:none}.chat-list{flex:1;overflow:auto}.chat-item{display:flex;align-items:center;gap:6px;margin:3px 0}.chat-load{flex:1;min-width:0;background:transparent;border:0;padding:10px;border-radius:9px;text-align:left;color:var(--text);overflow:hidden}.chat-load:hover,.chat-item.active .chat-load{background:var(--panel2)}.chat-name{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-actions{display:flex;opacity:0}.chat-item:hover .chat-actions,.chat-item:focus-within .chat-actions{opacity:1}.icon-btn{border:0;background:transparent;padding:8px;border-radius:8px;color:var(--muted)}.icon-btn:hover{background:var(--panel2);color:var(--text)}.sidebar-bottom{border-top:1px solid var(--border);padding-top:10px}.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}.topbar{height:62px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:10px;backdrop-filter:blur(16px);background:rgba(8,9,13,.55);z-index:5}.light .topbar{background:rgba(255,255,255,.65)}.mobile-menu{display:none}.top-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top-spacer{flex:1}.chat-area{flex:1;overflow-y:auto;scroll-behavior:smooth}.messages{max-width:900px;margin:0 auto;padding:30px 22px 150px}.welcome{min-height:calc(100vh - 230px);display:grid;place-items:center;text-align:center;padding:35px 0}.welcome-inner{max-width:760px}.welcome .logo{margin:0 auto 18px;width:56px;height:56px;font-size:22px}h1{font-size:clamp(30px,5vw,48px);margin:0 0 12px;letter-spacing:-1.5px}.subtitle{color:var(--muted);font-size:16px;line-height:1.7;margin:0 auto 25px}.prompt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:left}.prompt{padding:15px;background:rgba(255,255,255,.035);border:1px solid var(--border);border-radius:14px}.message{display:flex;gap:13px;margin:22px 0}.message.user{justify-content:flex-end}.avatar{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:800;font-size:12px}.user .avatar{order:2;background:var(--panel2)}.bubble{max-width:min(760px,82%);line-height:1.65;word-break:break-word}.user .bubble{background:var(--user);border:1px solid var(--border);padding:12px 15px;border-radius:16px 16px 4px 16px}.ai .bubble{padding-top:2px}.bubble p{margin:0 0 12px}.bubble h1,.bubble h2,.bubble h3{margin:15px 0 8px;font-size:20px}.bubble ul,.bubble ol{padding-left:22px}.inline-code{background:var(--panel2);border:1px solid var(--border);padding:2px 5px;border-radius:5px}.code-wrap{position:relative;margin:12px 0}pre{margin:0;background:#07080c;border:1px solid var(--border);padding:15px;border-radius:12px;overflow:auto;font-size:13px;line-height:1.55}pre button{position:absolute;right:8px;top:8px;border:1px solid var(--border);background:#151923;color:#ddd;border-radius:7px;padding:5px 8px;font-size:12px}.message-tools{display:flex;gap:3px;margin-top:6px}.message-tools button{font-size:12px;color:var(--muted);border:0;background:transparent;padding:5px 7px;border-radius:7px}.typing{display:flex;gap:5px;padding:10px 0}.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1s infinite}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}@keyframes bounce{50%{transform:translateY(-5px);opacity:.5}}.composer-wrap{position:absolute;bottom:0;left:0;right:0;padding:15px 20px 20px;background:linear-gradient(transparent,var(--bg) 35%)}.composer{max-width:900px;margin:auto;background:var(--panel);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:9px;display:flex;align-items:flex-end;gap:6px}textarea{flex:1;resize:none;max-height:180px;min-height:42px;border:0;outline:0;background:transparent;color:var(--text);padding:10px 7px;line-height:1.5}.attach,.mic,.send,.stop{width:40px;height:40px;border:0;border-radius:11px;background:transparent;display:grid;place-items:center}.send{background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:900}.stop{background:rgba(255,93,115,.12);color:var(--danger)}.disclaimer{max-width:900px;margin:7px auto 0;text-align:center;color:var(--muted);font-size:11px}.attachments{max-width:900px;margin:0 auto 7px;display:flex;gap:8px;flex-wrap:wrap}.file-chip{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:7px 9px}.file-chip img{width:28px;height:28px;object-fit:cover;border-radius:6px}.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15}.modal{position:fixed;inset:0;display:none;place-items:center;z-index:30;background:rgba(0,0,0,.5)}.modal-card{width:min(520px,92vw);max-height:85vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:20px}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.setting{padding:13px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:20px}.setting small{display:block;color:var(--muted);margin-top:4px}select{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px}.switch{position:relative;width:44px;height:24px}.switch input{display:none}.slider{position:absolute;inset:0;background:#394150;border-radius:20px}.slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:var(--accent)}.switch input:checked+.slider:before{transform:translateX(20px)}.hidden{display:none!important}.toast{position:fixed;right:18px;bottom:18px;background:var(--panel);border:1px solid var(--border);padding:11px 14px;border-radius:10px;box-shadow:var(--shadow);z-index:50}@media(max-width:760px){.sidebar{position:fixed;left:-290px;top:0;bottom:0;transition:.25s;box-shadow:var(--shadow)}.sidebar.open{left:0}.overlay.open{display:block}.mobile-menu{display:grid}.messages{padding:22px 14px 145px}.bubble{max-width:86%}.prompt-grid{grid-template-columns:1fr}.composer-wrap{padding:10px 10px 13px}.topbar{padding:0 10px}.message{gap:8px}.avatar{width:30px;height:30px;flex-basis:30px}.welcome{min-height:calc(100vh - 200px)}}
</style>
</head>
<body>
<div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">Q</div><span>Qasim AI</span></div><button class="new-chat" id="newChat">＋ New chat</button><div class="search"><input id="searchChats" type="search" placeholder="Search chats…"></div><div class="chat-list" id="chatList"></div><div class="sidebar-bottom"><button class="new-chat" id="settingsBtn">⚙ Settings</button><button class="icon-btn" id="clearHistory" style="width:100%;text-align:left;margin-top:5px">🗑 Clear all chats</button></div></aside><div class="overlay" id="overlay"></div><main class="main"><header class="topbar"><button class="icon-btn mobile-menu" id="menuBtn">☰</button><div class="top-title" id="topTitle">New chat</div><div class="top-spacer"></div><button class="icon-btn" id="themeQuick">☾</button></header><section class="chat-area" id="chatArea"><div class="messages" id="messages"></div></section><div class="composer-wrap"><div class="attachments" id="attachments"></div><div class="composer"><input id="fileInput" class="hidden" type="file" multiple accept="image/*,.txt,.md,.csv,.json,.pdf,text/plain,text/markdown,application/pdf"><button class="attach" id="attachBtn">＋</button><textarea id="input" rows="1" placeholder="Message Qasim AI…"></textarea><button class="mic" id="micBtn">⌕</button><button class="send" id="sendBtn">➤</button><button class="stop hidden" id="stopBtn">■</button></div><div class="disclaimer">Qasim AI can make mistakes.</div></div></main></div>
<div class="modal" id="settingsModal"><div class="modal-card"><div class="modal-head"><h2 style="margin:0">Settings</h2><button class="icon-btn" id="closeSettings">✕</button></div><div class="setting"><div><b>Appearance</b><small>Choose the interface theme.</small></div><select id="themeSelect"><option value="dark">Dark</option><option value="light">Light</option></select></div><div class="setting"><div><b>Font size</b></div><select id="fontSize"><option value="14">Small</option><option value="15">Default</option><option value="17">Large</option><option value="19">Extra large</option></select></div><div class="setting"><div><b>Enter to send</b></div><label class="switch"><input id="enterSend" type="checkbox" checked><span class="slider"></span></label></div><div class="setting"><div><b>AI / API settings</b><small>Secure Cloudflare backend connected.</small></div><span>✓</span></div><div class="setting"><div><b>Clear chat history</b></div><button class="icon-btn" id="clearHistory2">Clear</button></div></div></div>
<script>
const CONFIG={API_URL:"https://qasim-ai-api.q9999499.workers.dev/v1/chat/completions",API_KEY:"",MODEL:"gpt-4o-mini",TIMEOUT_MS:60000};
const SYSTEM_PROMPT=`You are Qasim, a friendly, intelligent AI assistant. Be helpful, clear, accurate and professional. Be concise when appropriate. Understand and respond naturally in English, Urdu, Roman Urdu, and mixed Urdu/English. Never claim to have performed an action, accessed a file, browsed the internet, used a tool, or completed a task unless you actually performed that action. If something is unavailable, explain the limitation honestly.`;
const $=id=>document.getElementById(id),STORAGE="qasim_ai_state_v1";let state=loadState(),activeChatId=state.activeChatId||null,generating=false,abortController=null,attachments=[],recognition=null;
function loadState(){try{const s=JSON.parse(localStorage.getItem(STORAGE)||"{}");return{chats:Array.isArray(s.chats)?s.chats:[],activeChatId:s.activeChatId||null,settings:{theme:s.settings?.theme||"dark",fontSize:s.settings?.fontSize||"15",enterSend:s.settings?.enterSend!==false}}}catch(e){return{chats:[],activeChatId:null,settings:{theme:"dark",fontSize:"15",enterSend:true}}}}
function saveState(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){toast("Browser storage is unavailable.")}}function currentChat(){return state.chats.find(c=>c.id===activeChatId)||null}function newChat(){const c={id:uid(),title:"New chat",created:Date.now(),updated:Date.now(),messages:[]};state.chats.unshift(c);activeChatId=c.id;state.activeChatId=c.id;saveState();renderAll();closeSidebar();$("input").focus()}function ensureChat(){if(!currentChat())newChat();return currentChat()}function uid(){return"c_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8)}function autoTitle(t){t=t.replace(/\s+/g," ").trim();return t.length>42?t.slice(0,42)+"…":t||"New chat"}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderMarkdown(src){let s=escapeHTML(src),blocks=[];s=s.replace(/```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g,(_,l,c)=>{const i=blocks.length;blocks.push(`<div class="code-wrap"><pre><code>${c.trim()}</code></pre><button data-copy-code="${i}">Copy</button></div>`);return`@@CODE${i}@@`});s=s.replace(/^### (.+)$/gm,"<h3>$1</h3>").replace(/^## (.+)$/gm,"<h2>$1</h2>").replace(/^# (.+)$/gm,"<h1>$1</h1>").replace(/`([^`\n]+)`/g,'<span class="inline-code">$1</span>').replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");s=s.split(/\n{2,}/).map(p=>p.trim().startsWith("<h")||p.trim().startsWith("<ul>")||p.includes("@@CODE")?p:"<p>"+p.replace(/\n/g,"<br>")+"</p>").join("");blocks.forEach((b,i)=>s=s.replace(`@@CODE${i}@@`,b));return s}
function renderMessages(){const box=$("messages"),chat=currentChat();if(!chat||!chat.messages.length){box.innerHTML=`<div class="welcome"><div class="welcome-inner"><div class="logo">Q</div><h1>How can I help you?</h1><p class="subtitle">Meet Qasim AI — a fast, friendly assistant for ideas, writing, coding, learning and everyday questions.</p><div class="prompt-grid"><button class="prompt">Explain quantum computing simply</button><button class="prompt">Write a professional email</button><button class="prompt">Help me build a website</button><button class="prompt">Translate this into Urdu</button></div></div></div>`;document.querySelectorAll(".prompt").forEach(b=>b.onclick=()=>{$("input").value=b.textContent;autoGrow();sendMessage()});return}box.innerHTML=chat.messages.map((m,i)=>{const u=m.role==="user",content=u?escapeHTML(m.content).replace(/\n/g,"<br>"):renderMarkdown(m.content);return`<article class="message ${u?"user":"ai"}"><div class="avatar">${u?"You":"Q"}</div><div class="bubble">${content}${!u?`<div class="message-tools"><button data-copy="${i}">Copy</button><button data-regenerate="${i}">Regenerate</button></div>`:""}</div></article>`}).join("");box.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copyText(chat.messages[+b.dataset.copy].content));box.querySelectorAll("[data-regenerate]").forEach(b=>b.onclick=()=>regenerate(+b.dataset.regenerate));requestAnimationFrame(()=>$("chatArea").scrollTop=$("chatArea").scrollHeight)}
function renderChats(){const q=$("searchChats").value.trim().toLowerCase(),list=state.chats.filter(c=>c.title.toLowerCase().includes(q));$("chatList").innerHTML=list.map(c=>`<div class="chat-item ${c.id===activeChatId?"active":""}"><button class="chat-load" data-load="${c.id}"><span class="chat-name">${escapeHTML(c.title)}</span></button><div class="chat-actions"><button class="icon-btn" data-rename="${c.id}">✎</button><button class="icon-btn" data-delete="${c.id}">×</button></div></div>`).join("")||`<div style="padding:15px;color:var(--muted);font-size:13px">No chats found.</div>`;document.querySelectorAll("[data-load]").forEach(b=>b.onclick=()=>{activeChatId=b.dataset.load;state.activeChatId=activeChatId;saveState();renderAll();closeSidebar()});document.querySelectorAll("[data-rename]").forEach(b=>b.onclick=()=>renameChat(b.dataset.rename));document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>deleteChat(b.dataset.delete))}
function renderAll(){renderChats();renderMessages();$("topTitle").textContent=currentChat()?.title||"New chat";applySettings()}function renameChat(id){const c=state.chats.find(x=>x.id===id);if(!c)return;const n=prompt("Rename chat:",c.title);if(n!==null&&n.trim()){c.title=n.trim().slice(0,80);c.updated=Date.now();saveState();renderAll()}}function deleteChat(id){const c=state.chats.find(x=>x.id===id);if(!c)return;if(!confirm(`Delete "${c.title}"?`))return;state.chats=state.chats.filter(x=>x.id!==id);if(activeChatId===id)activeChatId=state.chats[0]?.id||null;state.activeChatId=activeChatId;saveState();renderAll()}function clearHistory(){if(!state.chats.length)return;if(confirm("Delete all saved chats from this browser?")){state.chats=[];activeChatId=null;state.activeChatId=null;saveState();renderAll();toast("Chat history cleared.")}}function applySettings(){document.body.classList.toggle("light",state.settings.theme==="light");document.documentElement.style.setProperty("--font",state.settings.fontSize+"px");$("themeSelect").value=state.settings.theme;$("fontSize").value=state.settings.fontSize;$("enterSend").checked=state.settings.enterSend;$("themeQuick").textContent=state.settings.theme==="dark"?"☀":"☾"}function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}function autoGrow(){const x=$("input");x.style.height="auto";x.style.height=Math.min(x.scrollHeight,180)+"px"}function addMessage(role,content){const c=ensureChat();c.messages.push({role,content,time:Date.now()});c.updated=Date.now();if(role==="user"&&c.messages.filter(m=>m.role==="user").length===1)c.title=autoTitle(content);state.chats.sort((a,b)=>b.updated-a.updated);saveState();renderAll()}
function setGenerating(on){generating=on;$("sendBtn").classList.toggle("hidden",on);$("stopBtn").classList.toggle("hidden",!on);if(on){$("messages").insertAdjacentHTML("beforeend",`<article class="message ai" id="typingMessage"><div class="avatar">Q</div><div class="bubble"><div class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div></article>`);requestAnimationFrame(()=>$("chatArea").scrollTop=$("chatArea").scrollHeight)}else $("typingMessage")?.remove()}
function extractText(data){return typeof data==="string"?data:data?.choices?.[0]?.message?.content??data?.choices?.[0]?.text??data?.message?.content??data?.content??data?.response??""}
async function callAPI(chat){const res=await fetch(CONFIG.API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:CONFIG.MODEL,messages:[...chat.messages.map(m=>({role:m.role,content:m.content}))]}),signal:(abortController=new AbortController()).signal});if(!res.ok){let msg=`Server error (${res.status})`;try{const d=await res.json();msg=d?.error?.message||msg}catch(e){}throw new Error(msg)}const d=await res.json();return extractText(d)}
function demoResponse(t){return`Aapka message receive ho gaya: **"${t.slice(0,220)}${t.length>220?"…":""}"**`}
async function sendMessage(){if(generating)return;const input=$("input"),text=input.value.trim();if(!text)return;addMessage("user",text);input.value="";autoGrow();setGenerating(true);try{const answer=await callAPI(currentChat());if(!answer.trim())throw new Error("The AI returned an empty response.");addMessage("assistant",answer)}catch(e){if(e.name!=="AbortError")addMessage("assistant",`I couldn't complete that request.\n\n**Error:** ${e.message||"Unknown error"}`)}finally{setGenerating(false)}}
async function regenerate(index){const c=currentChat();if(!c||generating)return;c.messages.splice(index);saveState();renderMessages();setGenerating(true);try{addMessage("assistant",await callAPI(c))}catch(e){if(e.name!=="AbortError")addMessage("assistant",`Error: ${e.message}`)}finally{setGenerating(false)}}function copyText(t){navigator.clipboard?.writeText(t).then(()=>toast("Copied."))}function openSidebar(){$("sidebar").classList.add("open");$("overlay").classList.add("open")}function closeSidebar(){$("sidebar").classList.remove("open");$("overlay").classList.remove("open")}
$("newChat").onclick=newChat;$("searchChats").oninput=renderChats;$("clearHistory").onclick=clearHistory;$("clearHistory2").onclick=()=>{clearHistory();$("settingsModal").style.display="none"};$("settingsBtn").onclick=()=>$("settingsModal").style.display="grid";$("closeSettings").onclick=()=>$("settingsModal").style.display="none";$("settingsModal").onclick=e=>{if(e.target===$("settingsModal"))$("settingsModal").style.display="none"};$("menuBtn").onclick=openSidebar;$("overlay").onclick=closeSidebar;$("themeQuick").onclick=()=>{state.settings.theme=state.settings.theme==="dark"?"light":"dark";saveState();applySettings()};$("themeSelect").onchange=e=>{state.settings.theme=e.target.value;saveState();applySettings()};$("fontSize").onchange=e=>{state.settings.fontSize=e.target.value;saveState();applySettings()};$("enterSend").onchange=e=>state.settings.enterSend=e.target.checked;$("input").addEventListener("input",autoGrow);$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&state.settings.enterSend){e.preventDefault();sendMessage()}});$("sendBtn").onclick=sendMessage;$("stopBtn").onclick=()=>{abortController?.abort();setGenerating(false)};$("attachBtn").onclick=()=>$("fileInput").click();$("fileInput").onchange=e=>{[...e.target.files].forEach(f=>{if(f.type.startsWith("image/")||f.type.startsWith("text/")||/\.(csv|json|pdf)$/i.test(f.name))attachments.push({name:f.name});});$("attachments").textContent=attachments.map(a=>a.name).join(", ");e.target.value=""};$("micBtn").onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast("Voice input is not supported.");recognition=new SR();recognition.lang="en-US";recognition.onresult=e=>{$("input").value=e.results[0][0].transcript;autoGrow()};recognition.start()};
if(!activeChatId&&state.chats.length)activeChatId=state.chats[0].id;state.activeChatId=activeChatId;saveState();renderAll();
</script></body></html>
