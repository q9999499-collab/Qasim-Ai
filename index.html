<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090d"><meta name="description" content="Qasim AI — free demo assistant"><title>Qasim AI</title>
<style>
:root{--bg:#08090d;--p:#0f121a;--p2:#171c27;--t:#f5f7fb;--m:#9aa4b2;--l:rgba(255,255,255,.09);--a:#7c5cff;--b:#35a7ff;--u:#1b2130}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 0%,rgba(124,92,255,.16),transparent 34%),radial-gradient(circle at 90% 15%,rgba(53,167,255,.1),transparent 30%),var(--bg);color:var(--t);overflow:hidden}button,textarea{font:inherit;color:inherit}button{cursor:pointer}.app{height:100vh;display:flex}.side{width:280px;padding:16px;border-right:1px solid var(--l);background:rgba(10,12,18,.92);display:flex;flex-direction:column;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));font-weight:900}.new{border:1px solid var(--l);background:linear-gradient(135deg,rgba(124,92,255,.2),rgba(53,167,255,.08));border-radius:12px;padding:12px;text-align:left;font-weight:700}.history{flex:1;overflow:auto}.history button{display:block;width:100%;border:0;background:transparent;padding:10px;border-radius:9px;text-align:left;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history button:hover{background:var(--p2);color:var(--t)}.foot{border-top:1px solid var(--l);padding-top:12px;color:var(--m);font-size:12px;line-height:1.5}.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:62px;border-bottom:1px solid var(--l);display:flex;align-items:center;padding:0 18px;gap:10px;background:rgba(8,9,13,.58);backdrop-filter:blur(15px)}.sp{flex:1}.badge{font-size:11px;padding:6px 9px;border-radius:99px;color:#a9dbff;background:rgba(53,167,255,.08);border:1px solid rgba(53,167,255,.3)}.menu{display:none;border:0;background:transparent;font-size:22px}.area{flex:1;overflow:auto}.msgs{max-width:900px;margin:auto;padding:30px 22px 150px}.welcome{min-height:calc(100vh - 230px);display:grid;place-items:center;text-align:center}.win{max-width:700px}.win .logo{margin:auto auto 18px;width:62px;height:62px}.win h1{font-size:clamp(32px,5vw,50px);margin:0 0 10px;letter-spacing:-1.7px}.win p{color:var(--m);line-height:1.7}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.card{border:1px solid var(--l);background:rgba(255,255,255,.035);padding:14px;border-radius:13px;text-align:left}.card small{display:block;color:var(--m);margin-top:4px}.msg{display:flex;gap:12px;margin:22px 0}.msg.user{justify-content:flex-end}.av{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));font-size:12px;font-weight:800}.user .av{order:2;background:var(--p2)}.bubble{max-width:min(760px,84%);line-height:1.65;white-space:pre-wrap;word-break:break-word}.user .bubble{background:var(--u);border:1px solid var(--l);padding:12px 15px;border-radius:16px 16px 4px 16px}.wrap{position:absolute;bottom:0;left:280px;right:0;padding:14px 20px 20px;background:linear-gradient(transparent,var(--bg) 35%)}.composer{max-width:900px;margin:auto;display:flex;gap:7px;padding:9px;border:1px solid var(--l);background:var(--p);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.3)}textarea{flex:1;min-height:42px;max-height:170px;resize:none;border:0;outline:0;background:transparent;padding:10px 7px;line-height:1.5}.send{width:42px;height:42px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--a),var(--b));font-weight:900}.clear{border:0;background:transparent;color:var(--m);padding:8px}.note{text-align:center;color:var(--m);font-size:11px;margin-top:7px}@media(max-width:760px){.side{position:fixed;z-index:20;left:-290px;top:0;bottom:0;transition:.2s}.side.open{left:0}.menu{display:block}.wrap{left:0;padding:10px}.msgs{padding:22px 14px 145px}.cards{grid-template-columns:1fr}.bubble{max-width:88%}}
</style></head>
<body><div class="app"><aside class="side" id="side"><div class="brand"><div class="logo">Q</div><span>Qasim AI</span></div><button class="new" id="new">＋ New chat</button><div class="history" id="history"></div><div class="foot">Free Demo Mode<br>No API key, billing or credits required.</div></aside><main class="main"><header class="top"><button class="menu" id="menu">☰</button><b id="title">New chat</b><div class="sp"></div><span class="badge">FREE DEMO</span><button class="clear" id="clear">Clear</button></header><section class="area" id="area"><div class="msgs" id="msgs"></div></section></main></div><div class="wrap"><div class="composer"><textarea id="input" rows="1" placeholder="Message Qasim AI…"></textarea><button class="send" id="send">➤</button></div><div class="note">Qasim AI Demo • Free local mode • Chats are stored only in this browser</div></div>
<script>
const K='qasim_demo_v3';let chats=JSON.parse(localStorage.getItem(K)||'[]'),active=null,$=id=>document.getElementById(id);function save(){localStorage.setItem(K,JSON.stringify(chats))}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}function cur(){return chats.find(c=>c.id===active)}function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function make(){let c={id:uid(),title:'New chat',messages:[]};chats.unshift(c);active=c.id;save();render();closeSide()}function answer(q){let l=q.toLowerCase();if(/^(hi|hello|hey|salam|assalam)/.test(l))return 'Assalam-o-Alaikum! 👋 Main Qasim AI Demo hoon. Aap English, Urdu ya Roman Urdu mein baat kar sakte hain.';if(l.includes('urdu'))return 'Bilkul! Main Urdu aur Roman Urdu mein jawab de sakta hoon. Aap apna sawal bhejein.';if(l.includes('website'))return 'Website ke liye goal, pages, design, mobile responsiveness aur hosting plan karein. Main step-by-step structure de sakta hoon.';if(l.includes('caption'))return 'Professional caption: strong opening + useful/emotional line + call to action + relevant hashtags. Topic bhej dein.';if(l.includes('artificial intelligence')||l.includes(' ai'))return 'Artificial Intelligence (AI) technology hai jo computers ko data aur patterns se useful tasks perform karne mein madad deti hai.';return 'Demo Mode active hai. Aapka message receive ho gaya:\n\n“'+q+'”\n\nYe free local demo hai, is liye kisi paid AI API ko call nahi kiya ja raha. Real AI backend baad mein securely connect kiya ja sakta hai.'}function sendText(t){t=t.trim();if(!t)return;if(!cur())make();let c=cur();c.messages.push({r:'user',t});if(c.title==='New chat')c.title=t.length>38?t.slice(0,38)+'…':t;save();render();setTimeout(()=>{c.messages.push({r:'ai',t:answer(t)});save();render()},350)}function render(){if(!cur()){make();return}let c=cur();$('title').textContent=c.title;$('history').innerHTML=chats.map(x=>'<button data-id="'+x.id+'">'+esc(x.title)+'</button>').join('');$('msgs').innerHTML=c.messages.length?c.messages.map(m=>'<div class="msg '+(m.r==='user'?'user':'ai')+'"><div class="av">'+(m.r==='user'?'You':'Q')+'</div><div class="bubble">'+esc(m.t)+'</div></div>').join(''):'<div class="welcome"><div class="win"><div class="logo">Q</div><h1>How can I help?</h1><p>Welcome to the new free Qasim AI Demo Mode. It works without API keys, billing or backend credits.</p><div class="cards"><button class="card" data-p="Explain artificial intelligence simply"><b>Explain AI</b><small>Simple beginner explanation</small></button><button class="card" data-p="Write a professional business caption"><b>Write a caption</b><small>Professional social copy</small></button><button class="card" data-p="Help me make a website plan"><b>Website plan</b><small>Step-by-step planning</small></button><button class="card" data-p="Reply in Urdu: hello Qasim"><b>Urdu / Roman Urdu</b><small>Natural Urdu chat</small></button></div></div></div>';$('area').scrollTop=$('area').scrollHeight}$('new').onclick=make;$('send').onclick=()=>{let i=$('input');sendText(i.value);i.value='';i.style.height='auto'};$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('send').click()}};$('input').oninput=e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,170)+'px'};$('history').onclick=e=>{let b=e.target.closest('[data-id]');if(b){active=b.dataset.id;save();render();closeSide()}};$('msgs').onclick=e=>{let b=e.target.closest('[data-p]');if(b)sendText(b.dataset.p)};$('clear').onclick=()=>{if(confirm('Clear all demo chats?')){chats=[];active=null;save();render()}};$('menu').onclick=()=>$('side').classList.toggle('open');function closeSide(){$('side').classList.remove('open')}render();
</script></body></html>
