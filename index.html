<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090d">
<meta name="description" content="Qasim AI — real AI chat powered by Cloudflare Workers AI.">
<title>Qasim AI</title>
<style>
:root{--bg:#08090d;--p:#0f121a;--p2:#171c27;--t:#f5f7fb;--m:#9aa4b2;--l:rgba(255,255,255,.09);--a:#7c5cff;--b:#35a7ff;--u:#1b2130;--danger:#ff667a}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 0%,rgba(124,92,255,.16),transparent 34%),radial-gradient(circle at 90% 15%,rgba(53,167,255,.1),transparent 30%),var(--bg);color:var(--t);overflow:hidden}button,textarea{font:inherit;color:inherit}button{cursor:pointer}.app{height:100vh;display:flex}.side{width:280px;padding:16px;border-right:1px solid var(--l);background:rgba(10,12,18,.94);display:flex;flex-direction:column;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));font-weight:900}.new{border:1px solid var(--l);background:linear-gradient(135deg,rgba(124,92,255,.2),rgba(53,167,255,.08));border-radius:12px;padding:12px;text-align:left;font-weight:700}.history{flex:1;overflow:auto}.history button{display:block;width:100%;border:0;background:transparent;padding:10px;border-radius:9px;text-align:left;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history button:hover{background:var(--p2);color:var(--t)}.foot{border-top:1px solid var(--l);padding-top:12px;color:var(--m);font-size:12px;line-height:1.5}.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:62px;border-bottom:1px solid var(--l);display:flex;align-items:center;padding:0 18px;gap:10px;background:rgba(8,9,13,.58);backdrop-filter:blur(15px)}.sp{flex:1}.badge{font-size:11px;padding:6px 9px;border-radius:99px;color:#a9dbff;background:rgba(53,167,255,.08);border:1px solid rgba(53,167,255,.3)}.menu{display:none;border:0;background:transparent;font-size:22px}.area{flex:1;overflow:auto}.msgs{max-width:900px;margin:auto;padding:30px 22px 150px}.welcome{min-height:calc(100vh - 230px);display:grid;place-items:center;text-align:center}.win{max-width:700px}.win .logo{margin:auto auto 18px;width:62px;height:62px}.win h1{font-size:clamp(32px,5vw,50px);margin:0 0 10px;letter-spacing:-1.7px}.win p{color:var(--m);line-height:1.7}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.card{border:1px solid var(--l);background:rgba(255,255,255,.035);padding:14px;border-radius:13px;text-align:left}.card small{display:block;color:var(--m);margin-top:4px}.msg{display:flex;gap:12px;margin:22px 0}.msg.user{justify-content:flex-end}.av{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));font-size:12px;font-weight:800}.user .av{order:2;background:var(--p2)}.bubble{max-width:min(760px,84%);line-height:1.65;white-space:pre-wrap;word-break:break-word}.user .bubble{background:var(--u);border:1px solid var(--l);padding:12px 15px;border-radius:16px 16px 4px 16px}.ai .bubble{background:transparent;padding:4px 0}.error{color:var(--danger)}.typing{color:var(--m);padding:6px 0}.wrap{position:absolute;bottom:0;left:280px;right:0;padding:14px 20px 20px;background:linear-gradient(transparent,var(--bg) 35%)}.composer{max-width:900px;margin:auto;display:flex;gap:7px;padding:9px;border:1px solid var(--l);background:var(--p);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.3)}textarea{flex:1;min-height:42px;max-height:170px;resize:none;border:0;outline:0;background:transparent;padding:10px 7px;line-height:1.5}.send{width:42px;height:42px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--a),var(--b));font-weight:900}.send:disabled{opacity:.5;cursor:not-allowed}.clear{border:0;background:transparent;color:var(--m);padding:8px}.note{text-align:center;color:var(--m);font-size:11px;margin-top:7px}@media(max-width:760px){.side{position:fixed;z-index:20;left:-290px;top:0;bottom:0;transition:.2s}.side.open{left:0}.menu{display:block}.wrap{left:0;padding:10px}.msgs{padding:22px 14px 145px}.cards{grid-template-columns:1fr}.bubble{max-width:88%}}
</style>
</head>
<body>
<div class="app"><aside class="side" id="side"><div class="brand"><div class="logo">Q</div><span>Qasim AI</span></div><button class="new" id="new">＋ New chat</button><div class="history" id="history"></div><div class="foot">Real AI Mode<br>Powered by Cloudflare Workers AI.<br>No OpenAI API key is used.</div></aside><main class="main"><header class="top"><button class="menu" id="menu">☰</button><b id="title">New chat</b><div class="sp"></div><span class="badge">CLOUDFLARE AI</span><button class="clear" id="clear">Clear</button></header><section class="area" id="area"><div class="msgs" id="msgs"></div></section></main></div><div class="wrap"><div class="composer"><textarea id="input" rows="1" placeholder="Message Qasim AI…"></textarea><button class="send" id="send">➤</button></div><div class="note">Qasim AI • Real AI mode • Your browser never receives an AI API key</div></div>
<script>
const CONFIG={API_URL:"https://qasim-ai-api.q9999499.workers.dev/v1/chat/completions",MODEL:"@cf/meta/llama-3.1-8b-instruct",TIMEOUT_MS:60000};
const KEY="qasim_real_v1";let chats=JSON.parse(localStorage.getItem(KEY)||"[]"),active=null,busy=false,$=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(chats))}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}function cur(){return chats.find(c=>c.id===active)}function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function make(){const c={id:uid(),title:"New chat",messages:[]};chats.unshift(c);active=c.id;save();render();closeSide()}function render(){const c=cur();if(!c){$("title").textContent="New chat";$('history').innerHTML="";$('msgs').innerHTML='<div class="welcome"><div class="win"><div class="logo">Q</div><h1>How can I help?</h1><p>Real AI chat powered by Cloudflare Workers AI. Ask in English, Urdu, or Roman Urdu.</p><div class="cards"><button class="card" data-p="Explain artificial intelligence simply"><b>Explain AI</b><small>Simple beginner explanation</small></button><button class="card" data-p="Write a professional business caption"><b>Write a caption</b><small>Professional social copy</small></button><button class="card" data-p="Help me make a website plan"><b>Website plan</b><small>Step-by-step planning</small></button><button class="card" data-p="Reply in Urdu: hello Qasim"><b>Urdu / Roman Urdu</b><small>Natural Urdu chat</small></button></div></div></div>';return}$("title").textContent=c.title;$('history').innerHTML=chats.map(x=>'<button data-id="'+x.id+'">'+esc(x.title)+'</button>').join('');$('msgs').innerHTML=c.messages.map(m=>'<div class="msg '+(m.r==='user'?'user':'ai')+'"><div class="av">'+(m.r==='user'?'You':'Q')+'</div><div class="bubble">'+esc(m.t)+'</div></div>').join('');$('area').scrollTop=$('area').scrollHeight}
async function sendText(text){text=text.trim();if(!text||busy)return;if(!cur())make();const c=cur();c.messages.push({r:'user',t:text});if(c.title==='New chat')c.title=text.length>38?text.slice(0,38)+'…':text;save();render();busy=true;$('send').disabled=true;$('msgs').insertAdjacentHTML('beforeend','<div class="msg ai" id="typing"><div class="av">Q</div><div class="bubble typing">Thinking…</div></div>');$('area').scrollTop=$('area').scrollHeight;const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),CONFIG.TIMEOUT_MS);try{const response=await fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:CONFIG.MODEL,messages:c.messages.map(m=>({role:m.r==='user'?'user':'assistant',content:m.t}))}),signal:controller.signal});const data=await response.json().catch(()=>null);if(!response.ok)throw new Error(data?.error?.message||`Backend error (${response.status})`);const answer=data?.choices?.[0]?.message?.content;if(!answer)throw new Error('The AI backend returned an empty response.');c.messages.push({r:'ai',t:answer});save();render()}catch(e){const msg=e.name==='AbortError'?'Request timed out. Please try again.':e.message||'Unable to connect to Qasim AI.';c.messages.push({r:'ai',t:'Error: '+msg});save();render()}finally{clearTimeout(timer);busy=false;$('send').disabled=false}}
$('new').onclick=make;$('send').onclick=()=>{const i=$('input');const t=i.value;i.value='';i.style.height='auto';sendText(t)};$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('send').click()}};$('input').oninput=e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,170)+'px'};$('history').onclick=e=>{const b=e.target.closest('[data-id]');if(b){active=b.dataset.id;render();closeSide()}};$('msgs').onclick=e=>{const b=e.target.closest('[data-p]');if(b)sendText(b.dataset.p)};$('clear').onclick=()=>{if(confirm('Clear all chats?')){chats=[];active=null;save();render()}};$('menu').onclick=()=>$('side').classList.toggle('open');function closeSide(){$('side').classList.remove('open')}render();
</script></body></html>
